name: iOS Build & Submit

on:
  push:
    branches:
      - main          # preview/TestFlight builds only — never production
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          # NOTE: production is intentionally excluded here.
          # Use the "iOS Production (App Store)" workflow for production builds.

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 1. Lint + Type-check (fast gate — fails before expensive EAS build)
  # ──────────────────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  # ──────────────────────────────────────────────────────────────────────
  # 2. EAS Build — iOS TestFlight (preview profile)
  # ──────────────────────────────────────────────────────────────────────
  build-preview:
    name: iOS TestFlight Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build — preview (TestFlight)
        run: eas build --platform ios --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL_STAGING }}
          EXPO_PUBLIC_APP_ENV: staging
          EXPO_PUBLIC_APPLE_WEEKLY_PRODUCT_ID: ${{ secrets.APPLE_WEEKLY_PRODUCT_ID }}
          EXPO_PUBLIC_APPLE_MONTHLY_PRODUCT_ID: ${{ secrets.APPLE_MONTHLY_PRODUCT_ID }}
          EXPO_PUBLIC_APPLE_YEARLY_PRODUCT_ID: ${{ secrets.APPLE_YEARLY_PRODUCT_ID }}

  # Android build will be added here when Play Store submission is needed.
  # Use: eas build --platform android --profile production --non-interactive

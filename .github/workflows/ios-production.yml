name: iOS Production (App Store)

# !! MANUAL ONLY — production builds never trigger automatically on push.
# This is now the ONLY workflow. Run it from: GitHub → Actions → iOS Production
# → Run workflow → pick the branch you want to build.
#
# The branch picker cannot be given a default by this file — GitHub always
# preselects the REPOSITORY default branch. That is why the repo default is
# `production`: it makes the preselected branch the correct one. The guard step
# below is the backstop for when it is changed back, or when someone picks a
# different branch by hand. Between them, a stale branch cannot reach TestFlight
# by accident — which is the failure mode this exists to prevent, since neither
# `tsc` nor the bundle check can tell a month-old tree from today's.
#
#   submit: "true"   build + upload to App Store Connect. The binary lands in
#                    TestFlight for sandbox IAP testing. This is the normal path.
#   submit: "false"  build only, download the .ipa from expo.dev.
#
# Uploading here does NOT submit for App Store review — that is a separate,
# deliberate click in App Store Connect after you have tested in TestFlight.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit to App Store Connect after build?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      allow_non_release_branch:
        description: "Build a branch other than 'production'? (build-only; never allowed with submit)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Single job on purpose. Every job is a separate hosted-runner acquisition, and
# a run dies with "The job was not acquired by Runner of type hosted even after
# multiple attempts" when GitHub can't allocate one — which is what killed runs
# #1, #3, #20, #21 and #22 on 2026-08-06. Steps still run in order, so the cheap
# checks below fail just as fast as a separate validate job did, but the run now
# depends on one allocation instead of two. (This reduces exposure; it can't
# eliminate it. If a run dies before any step logs, that's runner starvation on
# GitHub's side, not this workflow — just re-run it.)
jobs:
  build-production:
    name: Validate + EAS Build — iOS App Store
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      # First step on purpose: it needs no checkout and no runner setup beyond
      # allocation, so a wrong branch costs seconds instead of a 100-minute
      # timeout budget. `github.ref_name` is whatever was chosen in the branch
      # picker for a workflow_dispatch run.
      - name: Guard — release branch
        env:
          REF: ${{ github.ref_name }}
          SUBMIT: ${{ github.event.inputs.submit }}
          OVERRIDE: ${{ github.event.inputs.allow_non_release_branch }}
        run: |
          RELEASE_BRANCH="production"

          if [ "$REF" = "$RELEASE_BRANCH" ]; then
            echo "Building '$REF'. Submit to App Store Connect: $SUBMIT."
            exit 0
          fi

          # A binary that reaches App Store Connect is a binary that can reach
          # review, so the override deliberately does not cover submission.
          if [ "$SUBMIT" = "true" ]; then
            echo "::error::Refusing to submit '$REF' to App Store Connect — only '$RELEASE_BRANCH' may be submitted. Re-run with submit=false to produce a build-only .ipa, or merge into '$RELEASE_BRANCH' first."
            exit 1
          fi

          if [ "$OVERRIDE" != "true" ]; then
            echo "::error::Refusing to build '$REF' — expected '$RELEASE_BRANCH'. If this is deliberate, re-run with allow_non_release_branch=true."
            exit 1
          fi

          echo "::warning::Building non-release branch '$REF' (build-only). This .ipa must not be submitted."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

      # Catches Metro/import errors that would otherwise only surface as a
      # "Bundle JavaScript" failure ~30 minutes into the EAS build.
      - name: Bundle check (production JS)
        run: npx expo export --platform ios --output-dir /tmp/expo-export
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL_PRODUCTION }}
          EXPO_PUBLIC_APP_ENV: production

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build — production profile (App Store)
        run: eas build --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL_PRODUCTION }}
          EXPO_PUBLIC_APP_ENV: production

      # The .p8 is gitignored, so CI has no fallback copy — the secret is the
      # only source. Validate it here; otherwise an empty/malformed key fails
      # later inside eas submit with a much less obvious error.
      - name: Write App Store Connect API key
        if: github.event.inputs.submit == 'true'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::error::Secret APP_STORE_CONNECT_PRIVATE_KEY is empty or unset."
            exit 1
          fi
          mkdir -p src/appstorekey
          printf '%s\n' "$ASC_PRIVATE_KEY" > src/appstorekey/AuthKey_LY4822XN6Q.p8
          if ! grep -q 'BEGIN PRIVATE KEY' src/appstorekey/AuthKey_LY4822XN6Q.p8; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY is not a valid .p8 (no 'BEGIN PRIVATE KEY' header)."
            exit 1
          fi
          echo "ASC key written ($(wc -c < src/appstorekey/AuthKey_LY4822XN6Q.p8) bytes)."

      - name: EAS Submit — App Store Connect
        if: github.event.inputs.submit == 'true'
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

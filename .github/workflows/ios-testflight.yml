name: iOS TestFlight (Sandbox Testing)

# Builds the real, store-signed binary and uploads it to App Store Connect,
# where it becomes available in TestFlight for SANDBOX in-app-purchase testing
# BEFORE you ever release to the App Store.
#
# This is the "test the real app before production" path:
#   GitHub → Actions → iOS TestFlight (Sandbox Testing) → Run workflow
#
# After the upload finishes (+~15 min Apple processing):
#   1. App Store Connect → your app → TestFlight → add yourself as an Internal Tester
#   2. On the device: Settings → App Store → Sandbox Account → sign in with a
#      Sandbox Tester (App Store Connect → Users and Access → Sandbox Testers)
#   3. Install via the TestFlight app and run a real subscription purchase —
#      StoreKit automatically uses Apple's sandbox for TestFlight builds.
#
# Manual only — never triggers on push, so it never surprises App Store Connect.
on:
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

  build-and-submit:
    name: EAS Build + Submit to TestFlight
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build — production profile (store-signed binary)
        run: eas build --platform ios --profile production --non-interactive
        # NOTE: do NOT set EXPO_PUBLIC_* here — it would be silently ignored.
        # `eas build` only queues the job; the compile runs on EAS servers, which
        # never see this runner's environment. The values baked into the binary
        # come from the matching profile's `env` block in eas.json. Change them there.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p src/appstorekey
          printf '%s' "$ASC_PRIVATE_KEY" > src/appstorekey/AuthKey_LY4822XN6Q.p8

      - name: EAS Submit — App Store Connect (TestFlight)
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

name: iOS Preview (TestFlight)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  build-preview:
    name: EAS Build — iOS TestFlight
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build — preview profile (internal TestFlight)
        run: eas build --platform ios --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL_STAGING }}
          EXPO_PUBLIC_APP_ENV: staging
          EXPO_PUBLIC_APPLE_WEEKLY_PRODUCT_ID: ${{ secrets.APPLE_WEEKLY_PRODUCT_ID }}
          EXPO_PUBLIC_APPLE_MONTHLY_PRODUCT_ID: ${{ secrets.APPLE_MONTHLY_PRODUCT_ID }}
          EXPO_PUBLIC_APPLE_YEARLY_PRODUCT_ID: ${{ secrets.APPLE_YEARLY_PRODUCT_ID }}

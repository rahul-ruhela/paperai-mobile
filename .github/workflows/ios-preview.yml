name: iOS Preview (TestFlight)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

  build-preview:
    name: EAS Build — iOS TestFlight
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build — preview profile (internal TestFlight)
        run: eas build --platform ios --profile preview --non-interactive
        # NOTE: do NOT set EXPO_PUBLIC_* here — it would be silently ignored.
        # `eas build` only queues the job; the compile runs on EAS servers, which
        # never see this runner's environment. The values baked into the binary
        # come from the matching profile's `env` block in eas.json. Change them there.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

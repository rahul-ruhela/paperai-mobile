name: Android Preview (future)

# This workflow is DISABLED — Android Play Store is not yet targeted.
# Remove the `if: false` condition when ready to build for Android.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'android' to confirm Android build"
        required: true

jobs:
  build-android:
    name: EAS Build — Android Preview
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'android' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build — android preview
        run: eas build --platform android --profile preview --non-interactive
        # NOTE: do NOT set EXPO_PUBLIC_* here — it would be silently ignored.
        # `eas build` only queues the job; the compile runs on EAS servers, which
        # never see this runner's environment. The values baked into the binary
        # come from the matching profile's `env` block in eas.json. Change them there.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Uncomment when ready to submit to Google Play:

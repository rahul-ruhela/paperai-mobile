name: Android Preview (future)

# This workflow is DISABLED — Android Play Store is not yet targeted.
# Remove the `if: false` condition when ready to build for Android.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'android' to confirm Android build"
        required: true

jobs:
  build-android:
    name: EAS Build — Android Preview
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'android' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build — android preview
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL_STAGING }}
          EXPO_PUBLIC_APP_ENV: staging
          EXPO_PUBLIC_APPLE_WEEKLY_PRODUCT_ID: ${{ secrets.APPLE_WEEKLY_PRODUCT_ID }}
          EXPO_PUBLIC_APPLE_MONTHLY_PRODUCT_ID: ${{ secrets.APPLE_MONTHLY_PRODUCT_ID }}
          EXPO_PUBLIC_APPLE_YEARLY_PRODUCT_ID: ${{ secrets.APPLE_YEARLY_PRODUCT_ID }}

  # Uncomment when ready to submit to Google Play:
